name: 'Saleha: fix failing tests, with proof'
description: 'mode: fix -- when tests fail, a small open model inside the runner fixes the code, proves the fix (fails without it, passes with it, tests not weakened) and opens a PR. mode: review -- static PR review.'
author: 'Saleha'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  mode:
    description: '"fix": fix failing tests and open a pull request with the proof. "verify": prove or disprove a pull request (from anyone, or any AI) by running its tests, and comment the receipt. "review": static security and quality review of Python files.'
    required: false
    default: 'review'
  base:
    description: 'verify mode: the commit to compare against (default: the pull request base)'
    required: false
    default: ''
  comment:
    description: 'verify mode: post the proof receipt as a pull-request comment'
    required: false
    default: 'true'
  require:
    description: 'verify mode: fail the step unless the verdict is at least this -- "proven", "passing" (fail only when tests fail) or "none"'
    required: false
    default: 'passing'
  github-token:
    description: 'Token for pushing the fix branch and opening the pull request (fix mode)'
    required: false
    default: ${{ github.token }}
  python-version:
    description: 'review mode only. In fix mode the project is tested with the Python your job already set up (3.12+ needed), and Saleha itself runs in its own venv.'
    required: false
    default: '3.12'
  scan-path:
    description: 'review mode: directory or file to review'
    required: false
    default: '.'
  fail-on-critical:
    description: 'review mode: fail the step on Critical/High findings'
    required: false
    default: 'true'
  test-command:
    description: 'fix mode: the test command, e.g. "python -m pytest -q tests" (default: discovered from the repo)'
    required: false
    default: ''
  model:
    description: 'fix mode: the model. Default: gemini:gemini-3.8-flash when gemini-api-key is given, else qwen2.5-coder:3b run on the runner itself (your code then goes to no AI service)'
    required: false
    default: ''
  gemini-api-key:
    description: 'fix mode: a Google AI Studio key (use a secret). Faster and stronger than a model on a CPU runner, but the code under repair is sent to Google.'
    required: false
    default: ''
  open-pr:
    description: 'fix mode: open a pull request with a proven fix'
    required: false
    default: 'true'
  max-steps:
    description: 'fix mode: agent steps'
    required: false
    default: '15'
  timeout:
    description: 'fix mode: seconds for the agent run (CPU runners are slow; raise it for bigger models)'
    required: false
    default: '1500'

outputs:
  verdict:
    description: 'fix mode: FIXED, ALREADY_PASSING, FIXED_UNPROVEN, NOT_FIXED, CANNOT_RUN or HARNESS_ERROR'
    value: ${{ steps.report.outputs.verdict }}
  branch:
    description: 'fix mode: the branch holding a proven fix'
    value: ${{ steps.report.outputs.branch }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python (review)
      if: inputs.mode == 'review'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Saleha in its own venv
      shell: bash
      run: |
        python -c 'import sys; sys.exit(0 if sys.version_info >= (3, 12) else "Saleha needs Python 3.12+ on this job, found " + sys.version.split()[0])'
        # The project's tests run on the job's own interpreter, where its packages are.
        echo "SALEHA_TEST_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
        python -m venv "$RUNNER_TEMP/saleha-venv"
        SALEHA_PY="$RUNNER_TEMP/saleha-venv/bin/python"
        [ -x "$SALEHA_PY" ] || SALEHA_PY="$RUNNER_TEMP/saleha-venv/Scripts/python.exe"
        "$SALEHA_PY" -m pip install --quiet --upgrade pip
        "$SALEHA_PY" -m pip install --quiet click rich pydantic requests psutil PyYAML
        "$SALEHA_PY" -m pip install --quiet --no-deps -e "${{ github.action_path }}"
        echo "SALEHA_PY=$SALEHA_PY" >> "$GITHUB_ENV"

    - name: Choose the model (fix)
      if: inputs.mode == 'fix'
      shell: bash
      env:
        MODEL_IN: ${{ inputs.model }}
        HAS_GEMINI_KEY: ${{ inputs.gemini-api-key != '' }}
      run: |
        model="$MODEL_IN"
        if [ -z "$model" ]; then
          if [ "$HAS_GEMINI_KEY" = "true" ]; then model="gemini:gemini-3.8-flash"; else model="qwen2.5-coder:3b"; fi
        fi
        echo "SALEHA_MODEL=$model" >> "$GITHUB_ENV"
        echo "Saleha will use: $model"

    - name: Start a local model (fix)
      if: inputs.mode == 'fix' && !startsWith(env.SALEHA_MODEL, 'gemini')
      shell: bash
      run: |
        if ! command -v ollama >/dev/null; then
          curl -fsSL https://ollama.com/install.sh | sh
        fi
        if ! curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
          nohup ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
        fi
        ollama pull "$SALEHA_MODEL"

    - name: Fix failing tests (fix)
      if: inputs.mode == 'fix'
      shell: bash
      env:
        SALEHA_TEST_CMD: ${{ inputs.test-command }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
      run: |
        git config user.name "saleha-bot"
        git config user.email "saleha-bot@users.noreply.github.com"
        args=(fix --json --commit -m "$SALEHA_MODEL" --max-steps "${{ inputs.max-steps }}" --timeout "${{ inputs.timeout }}")
        if [ -n "$SALEHA_TEST_CMD" ]; then args+=("$SALEHA_TEST_CMD"); fi
        "$SALEHA_PY" -c 'from saleha.cli.commands import cli; cli()' "${args[@]}" > "$RUNNER_TEMP/saleha-fix.json" || true

    - name: Report (fix)
      id: report
      if: inputs.mode == 'fix'
      shell: bash
      run: |
        "$SALEHA_PY" "${{ github.action_path }}/scripts/ci_fix_report.py" "$RUNNER_TEMP/saleha-fix.json" "$RUNNER_TEMP/saleha-pr-body.md"

    - name: Open a pull request with the proven fix (fix)
      if: inputs.mode == 'fix' && steps.report.outputs.verdict == 'FIXED' && inputs.open-pr == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BRANCH: ${{ steps.report.outputs.branch }}
        BASE: ${{ github.head_ref || github.ref_name }}
      run: |
        git push origin "$BRANCH"
        gh pr create --base "$BASE" --head "$BRANCH" \
          --title "Saleha: fix failing tests (proven)" \
          --body-file "$RUNNER_TEMP/saleha-pr-body.md"

    - name: Prove the pull request (verify)
      if: inputs.mode == 'verify'
      shell: bash
      env:
        BASE_IN: ${{ inputs.base }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        SALEHA_TEST_CMD: ${{ inputs.test-command }}
      run: |
        base="${BASE_IN:-$PR_BASE_SHA}"
        if [ -z "$base" ]; then echo "::error title=Saleha verify::no base commit (run on pull_request, or set base)"; exit 1; fi
        # A shallow checkout lacks the base commit the receipt needs.
        git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base"
        args=(receipt --json --base "$base")
        if [ -n "$SALEHA_TEST_CMD" ]; then args+=(--test-cmd "$SALEHA_TEST_CMD"); fi
        "$SALEHA_PY" -c 'from saleha.cli.commands import cli; cli()' "${args[@]}" > "$RUNNER_TEMP/saleha-receipt.json" || true

    - name: Report (verify)
      id: verify
      if: inputs.mode == 'verify'
      shell: bash
      run: |
        "$SALEHA_PY" "${{ github.action_path }}/scripts/ci_verify_report.py" "$RUNNER_TEMP/saleha-receipt.json" "$RUNNER_TEMP/saleha-comment.md"

    - name: Comment the receipt on the pull request (verify)
      if: inputs.mode == 'verify' && inputs.comment == 'true' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/saleha-comment.md"

    - name: Enforce the required verdict (verify)
      if: inputs.mode == 'verify' && inputs.require != 'none'
      shell: bash
      env:
        VERDICT: ${{ steps.verify.outputs.verdict }}
        REQUIRE: ${{ inputs.require }}
      run: |
        if [ "$REQUIRE" = "proven" ] && [ "$VERDICT" != "PROVEN" ]; then
          echo "::error title=Saleha verify::verdict $VERDICT, but this workflow requires PROVEN"; exit 1
        fi
        if [ "$VERDICT" = "FAILING" ] || [ "$VERDICT" = "HARNESS_ERROR" ]; then
          echo "::error title=Saleha verify::verdict $VERDICT"; exit 1
        fi

    - name: Execute Saleha AI Code Review (review)
      id: review
      if: inputs.mode == 'review'
      shell: bash
      env:
        SALEHA_SCAN_PATH: ${{ inputs.scan-path }}
        SALEHA_FAIL_ON_CRITICAL: ${{ inputs.fail-on-critical }}
      run: |
        "$SALEHA_PY" "${{ github.action_path }}/scripts/run_pr_review.py"
