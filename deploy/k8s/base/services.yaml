apiVersion: v1
kind: Service
metadata:
  name: nexus-backend
  namespace: nexus-production
  labels:
    app: nexus-omni
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: nexus-omni
    component: backend

---
apiVersion: v1
kind: Service
metadata:
  name: nexus-frontend
  namespace: nexus-production
  labels:
    app: nexus-omni
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: nexus-omni
    component: frontend
