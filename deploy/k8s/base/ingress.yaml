apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-ingress
  namespace: nexus-production
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.mukti.ai
        - app.mukti.ai
      secretName: nexus-tls-secret
  rules:
    - host: api.mukti.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-backend
                port:
                  number: 8000
    - host: app.mukti.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-frontend
                port:
                  number: 3000
