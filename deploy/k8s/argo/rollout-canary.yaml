# k8s/argo/rollout-canary.yaml
# MUKTI Backend – Canary Deployment with Automated Analysis

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mukti-backend
  namespace: mukti
  labels:
    app: mukti-backend
spec:
  replicas: 5
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: mukti-backend
  template:
    metadata:
      labels:
        app: mukti-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: mukti-backend
      containers:
        - name: backend
          image: ghcr.io/mukti-foundation/mukti-backend:v1.0.0
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mukti-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: mukti-secrets
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mukti-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  # Canary Strategy
  strategy:
    canary:
      # Canary service (receives canary traffic)
      canaryService: mukti-backend-canary
      stableService: mukti-backend-stable
      # Traffic routing via Istio
      trafficRouting:
        istio:
          virtualServices:
            - name: mukti-backend-vs
              routes:
                - primary
      # Canary steps
      steps:
        # Step 1: Set canary weight to 10%
        - setWeight: 10
        # Step 2: Pause for 5 minutes for analysis
        - pause: { duration: 5m }
        # Step 3: Automated analysis
        - analysis:
            templates:
              - templateName: mukti-canary-analysis
            args:
              - name: service-name
                value: mukti-backend-canary
        # Step 4: Increase to 25%
        - setWeight: 25
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: mukti-canary-analysis
        # Step 5: Increase to 50%
        - setWeight: 50
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: mukti-canary-analysis
        # Step 6: Increase to 75%
        - setWeight: 75
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: mukti-canary-analysis
        # Step 7: Final 100%
        - setWeight: 100
      # Auto rollback on failure
      abortScaleDownDelaySeconds: 30
      # Dynamic scaling
      dynamicStableScale: true
