# k8s/argo/services.yaml
# Canary and Stable Services

apiVersion: v1
kind: Service
metadata:
  name: mukti-backend-canary
  namespace: mukti
spec:
  selector:
    app: mukti-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: mukti-backend-stable
  namespace: mukti
spec:
  selector:
    app: mukti-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
