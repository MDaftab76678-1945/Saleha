# k8s/argo/analysis-template.yaml
# Automated Canary Analysis – Checks error rate and latency

apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: mukti-canary-analysis
  namespace: mukti
spec:
  args:
    - name: service-name
  metrics:
    # Metric 1: Error Rate (must be < 5%)
    - name: error-rate
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            (
              sum(rate(http_requests_total{status_code=~"5..", service="{{ args.service-name }}"}[5m]))
              /
              sum(rate(http_requests_total{service="{{ args.service-name }}"}[5m]))
            ) * 100
      successCondition: result < 5
      failureLimit: 3
      interval: 60s

    # Metric 2: P99 Latency (must be < 2s)
    - name: latency-p99
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{service="{{ args.service-name }}"}[5m])) by (le)
            )
      successCondition: result < 2
      failureLimit: 3
      interval: 60s

    # Metric 3: Pod Restarts (must be 0)
    - name: pod-restarts
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            sum(increase(kube_pod_container_status_restarts_total{
              pod=~"{{ args.service-name }}.*"
            }[5m]))
      successCondition: result == 0
      failureLimit: 1
      interval: 60s

    # Metric 4: Agent Task Error Rate (must be < 10%)
    - name: agent-error-rate
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            (
              sum(rate(mukti_tasks_total{status="failure"}[5m]))
              /
              sum(rate(mukti_tasks_total[5m]))
            ) * 100
      successCondition: result < 10
      failureLimit: 3
      interval: 60s

    # Metric 5: ZK Verification Failures (must be 0)
    - name: zk-failures
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            sum(increase(mukti_zk_verifications_total{result="invalid"}[5m]))
      successCondition: result == 0
      failureLimit: 1
      interval: 60s
