# ================================================================
# MUKTI - Argo Rollouts Progressive Delivery
# Canary deployment with automated analysis
# ================================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mukti-backend-rollout
  namespace: mukti
  labels:
    app: mukti-backend
spec:
  replicas: 5
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: mukti-backend
  template:
    metadata:
      labels:
        app: mukti-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/mukti-foundation/mukti:{{ .Values.image.tag }}
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
  strategy:
    canary:
      canaryService: mukti-backend-canary
      stableService: mukti-backend-stable
      trafficRouting:
        istio:
          virtualServices:
            - name: mukti-backend-vs
              routes:
                - primary
      steps:
        # Step 1: 5% canary
        - setWeight: 5
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: mukti-success-rate
            args:
              - name: service-name
                value: mukti-backend-canary
                
        # Step 2: 25% canary
        - setWeight: 25
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: mukti-success-rate
              - templateName: mukti-latency
            args:
              - name: service-name
                value: mukti-backend-canary
                
        # Step 3: 50% canary
        - setWeight: 50
        - pause: { duration: 10m }
        - analysis:
            templates:
              - templateName: mukti-success-rate
              - templateName: mukti-latency
              - templateName: mukti-error-budget
            args:
              - name: service-name
                value: mukti-backend-canary
                
        # Step 4: 75% canary
        - setWeight: 75
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: mukti-success-rate
            args:
              - name: service-name
                value: mukti-backend-canary
                
        # Step 5: 100%
        - setWeight: 100
      
      # Auto rollback on failure
      abortScaleDownDelaySeconds: 30
      dynamicStableScale: true
      
      # Analysis run configuration
      analysis:
        templates:
          - templateName: mukti-success-rate
        startingStep: 1
        args:
          - name: service-name
            value: mukti-backend-canary
