# ================================================================
# MUKTI - Argo Rollouts Analysis Templates
# Automated analysis for canary deployments
# ================================================================
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: mukti-success-rate
  namespace: mukti
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      provider:
        prometheus:
          address: http://prometheus.mukti-monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}", status_code!~"5.."}[5m]))
            /
            sum(rate(http_requests_total{service="{{args.service-name}}"}[5m]))
      successCondition: result >= 0.95
      failureLimit: 3
      interval: 60s
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: mukti-latency
  namespace: mukti
spec:
  args:
    - name: service-name
  metrics:
    - name: latency-p95
      provider:
        prometheus:
          address: http://prometheus.mukti-monitoring.svc:9090
          query: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{service="{{args.service-name}}"}[5m])) by (le)
            )
      successCondition: result <= 2
      failureLimit: 3
      interval: 60s
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: mukti-error-budget
  namespace: mukti
spec:
  args:
    - name: service-name
  metrics:
    - name: error-budget
      provider:
        prometheus:
          address: http://prometheus.mukti-monitoring.svc:9090
          query: |
            1 - (
              sum(rate(http_requests_total{service="{{args.service-name}}", status_code!~"5.."}[24h]))
              /
              sum(rate(http_requests_total{service="{{args.service-name}}"}[24h]))
            )
      successCondition: result <= 0.01
      failureLimit: 2
      interval: 300s
