# ================================================================
# MUKTI - ArgoCD ApplicationSet
# Multi-environment deployment with Git generator
# ================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mukti-environments
  namespace: argocd
spec:
  generators:
    # Git generator - creates apps per environment
    - git:
        repoURL: https://github.com/mukti-foundation/mukti
        revision: main
        directories:
          - path: k8s/environments/*
    # Cluster generator - deploy to multiple clusters
    - clusters:
        selector:
          matchLabels:
            environment: production
  template:
    metadata:
      name: 'mukti-{{path.basename}}'
      labels:
        environment: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/mukti-foundation/mukti
        targetRevision: main
        path: '{{path}}'
      destination:
        server: '{{server}}'
        namespace: mukti
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
# Progressive sync ApplicationSet
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mukti-progressive
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: mukti-primary
            url: https://primary.k8s.mukti.ai
            environment: production
          - cluster: mukti-secondary
            url: https://secondary.k8s.mukti.ai
            environment: production
  template:
    metadata:
      name: 'mukti-{{cluster}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/mukti-foundation/mukti
        targetRevision: main
        path: k8s/helm/mukti
        helm:
          valueFiles:
            - values.yaml
            - values-production.yaml
      destination:
        server: '{{url}}'
        namespace: mukti
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
      # Progressive sync - sync primary first
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            environment: production
