# ================================================================
# MUKTI - ArgoCD App of Apps Pattern
# Root application that manages all other applications
# ================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mukti-app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mukti-foundation/mukti
    targetRevision: main
    path: k8s/gitops/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
