# k8s/rollout/services.yaml
# Stable + canary services required by Argo Rollouts
apiVersion: v1
kind: Service
metadata:
  name: mukti-api-stable
  namespace: mukti
spec:
  selector:
    app.kubernetes.io/name: mukti
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: mukti-api-canary
  namespace: mukti
spec:
  selector:
    app.kubernetes.io/name: mukti
  ports:
    - name: http
      port: 80
      targetPort: 8000
