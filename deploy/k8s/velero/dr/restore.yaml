# ================================================================
# MUKTI - Disaster Recovery Restore Templates
# ================================================================
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: mukti-full-restore
  namespace: velero
spec:
  backupName: mukti-daily-backup-{{ .Date }}
  includedNamespaces:
    - mukti
    - mukti-monitoring
    - mukti-database
  restorePVs: true
  restoreStatus:
    includedResources:
      - deployments
      - statefulsets
      - services
  preserveNodePorts: false
  namespaceMapping:
    mukti: mukti-restored
---
# Emergency restore - latest backup only
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: mukti-emergency-restore
  namespace: velero
spec:
  backupName: latest
  includedNamespaces:
    - mukti
    - mukti-database
  restorePVs: true
  preserveNodePorts: false
