# ================================================================
# MUKTI - Backup Storage Locations
# Multi-region backup storage with replication
# ================================================================
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: velero
spec:
  provider: aws
  objectStorage:
    bucket: mukti-backups
    prefix: primary
  config:
    region: us-east-1
    s3Url: https://s3.us-east-1.amazonaws.com
  default: true
---
# Secondary region backup location
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: secondary-region
  namespace: velero
spec:
  provider: aws
  objectStorage:
    bucket: mukti-backups
    prefix: secondary
  config:
    region: eu-west-1
    s3Url: https://s3.eu-west-1.amazonaws.com
  default: false
---
# Volume snapshot location
apiVersion: velero.io/v1
kind: VolumeSnapshotLocation
metadata:
  name: default
  namespace: velero
spec:
  provider: aws
  config:
    region: us-east-1
---
# Secondary region snapshot location
apiVersion: velero.io/v1
kind: VolumeSnapshotLocation
metadata:
  name: secondary
  namespace: velero
spec:
  provider: aws
  config:
    region: eu-west-1
