# k8s/helm/mukti/templates/prometheus-rules.yaml
{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "mukti.fullname" . }}-alerts
  labels:
    {{- include "mukti.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.prometheusRelease | default "prometheus" }}
spec:
  groups:
    - name: mukti.agent.rules
      rules:
        # High error rate alert
        - alert: MuktiAgentErrorRateHigh
          expr: |
            sum(rate(mukti_errors_total[5m])) by (agent)
            /
            sum(rate(mukti_tasks_total[5m])) by (agent)
            > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Agent {{ $labels.agent }} has high error rate"
            description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

        # Task queue depth alert
        - alert: MuktiQueueDepthHigh
          expr: mukti_queue_depth > 100
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Queue depth high for {{ $labels.agent }}"
            description: "Queue depth is {{ $value }} (threshold: 100)"

        # Task latency alert (p95 > 30s)
        - alert: MuktiTaskLatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum(rate(mukti_task_duration_seconds_bucket[5m])) by (le, agent)
            ) > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Task latency high for {{ $labels.agent }}"
            description: "p95 latency is {{ $value }}s (threshold: 30s)"

    - name: mukti.llm.rules
      rules:
        # LLM API failure rate
        - alert: MuktiLLMFailureRateHigh
          expr: |
            sum(rate(mukti_llm_requests_total{status="failure"}[5m]))
            /
            sum(rate(mukti_llm_requests_total[5m]))
            > 0.10
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "LLM API failure rate high"
            description: "Failure rate is {{ $value | humanizePercentage }} (threshold: 10%)"

        # Token usage spike
        - alert: MuktiTokenUsageSpike
          expr: |
            sum(rate(mukti_tokens_total[5m])) > 1000
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "High token usage detected"
            description: "Token rate is {{ $value }}/s"

    - name: mukti.zk.rules
      rules:
        # ZK verification failure rate
        - alert: MuktiZKVerificationFailures
          expr: |
            sum(rate(mukti_zk_verifications_total{result="invalid"}[5m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "ZK proof verification failures detected"
            description: "Invalid proofs are being submitted - possible attack"

    - name: mukti.availability.rules
      rules:
        # No active agents
        - alert: MuktiNoActiveAgents
          expr: mukti_active_agents == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "No active agents"
            description: "All agents are down"

        # Pod restarts
        - alert: MuktiPodRestarts
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace="{{ .Release.Namespace }}",
              pod=~"{{ include "mukti.fullname" . }}.*"
            }[1h]) > 3
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} restarting frequently"
            description: "{{ $value }} restarts in the last hour"
{{- end }}
