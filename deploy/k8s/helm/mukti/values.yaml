# k8s/helm/mukti/values.yaml
# Base values – safe defaults for all environments

replicaCount: 2

image:
  repository: ghcr.io/mukti-foundation/mukti-api
  tag: ""  # Defaults to appVersion
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: /metrics

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false  # Enabled per-environment

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  enabled: false
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone

probes:
  liveness:
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

env:
  MUKTI_ENVIRONMENT: "production"
  MUKTI_LOG_LEVEL: "INFO"

# Secrets referenced by name (created externally / SealedSecrets)
existingSecret: mukti-secrets

volumes:
  - name: tmp
    emptyDir: {}
  - name: data
    persistentVolumeClaim:
      claimName: mukti-agent-data

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: data
    mountPath: /app/data

persistence:
  enabled: true
  size: 20Gi
  storageClass: ""

monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
  prometheusRules:
    enabled: true

nodeSelector: {}
tolerations: []
affinity: {}
