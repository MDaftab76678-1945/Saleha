apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nexus-omni-strict-egress
  namespace: nexus-omni
spec:
  podSelector:
    matchLabels:
      app: nexus-omni-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Only allow traffic from the internal Nginx Ingress
  - from:
    - podSelector:
        matchLabels:
          app: nginx-ingress
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # ALLOW: Internal DNS resolution
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # ALLOW: Internal Database and Redis ONLY
  - to:
    - podSelector:
        matchLabels:
          app: nexus-omni-db
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: nexus-omni-redis
    ports:
    - protocol: TCP
      port: 6379
  # BLOCK: ALL OTHER INTERNET EGRESS (Prevents data exfiltration)
  # (Default deny is enforced by not having an 'allow all' egress rule)
