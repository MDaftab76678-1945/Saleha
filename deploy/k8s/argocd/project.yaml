# k8s/argocd/project.yaml
# AppProject scopes what ArgoCD can deploy where (RBAC for GitOps)
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mukti
  namespace: argocd
spec:
  description: MUKTI AI agent platform

  # Only deploy from the official repo
  sourceRepos:
    - "https://github.com/mukti-foundation/mukti"

  # Only these target clusters/namespaces
  destinations:
    - namespace: mukti
      server: https://kubernetes.default.svc
    - namespace: mukti-monitoring
      server: https://kubernetes.default.svc

  # Allow cluster-scoped resources we actually need
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: networking.k8s.io
      kind: Ingress
    - group: monitoring.coreos.com
      kind: PrometheusRule

  # Deny dangerous resources
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange

  # Sync windows: block deploys during peak hours (optional)
  syncWindows:
    - kind: deny
      schedule: "0 9 * * 1-5"   # No syncs 9AM weekdays start
      duration: 1h
      applications: ["*"]
      manualSync: true          # Manual sync still allowed
