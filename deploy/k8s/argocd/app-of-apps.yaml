# k8s/argocd/app-of-apps.yaml
# Root "app of apps" – manages all MUKTI applications
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mukti-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mukti
  source:
    repoURL: https://github.com/mukti-foundation/mukti
    targetRevision: main
    path: k8s/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true        # Delete resources removed from git
      selfHeal: true     # Revert manual kubectl changes
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
