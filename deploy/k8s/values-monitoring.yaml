# k8s/values-monitoring.yaml
# Helm values for monitoring stack

monitoring:
  enabled: true
  prometheus:
    enabled: true
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
  grafana:
    enabled: true
    adminPassword: admin
    dashboards:
      enabled: true
  alertmanager:
    enabled: true
    config:
      route:
        receiver: default
        routes:
          - match:
              severity: critical
            receiver: pagerduty
          - match:
              severity: warning
            receiver: slack
      receivers:
        - name: default
        - name: pagerduty
          pagerduty_configs:
            - service_key: <pagerduty-service-key>
        - name: slack
          slack_configs:
            - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
              channel: "#mukti-alerts"
              send_resolved: true

argoRollouts:
  enabled: true
  controller:
    replicas: 1
