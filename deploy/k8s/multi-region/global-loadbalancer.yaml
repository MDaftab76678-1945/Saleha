# ================================================================
# MUKTI - Global Load Balancer Configuration
# AWS Global Accelerator / CloudFront based routing
# ================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mukti-global-ingress
  namespace: mukti
  annotations:
    # AWS Load Balancer Controller
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789:certificate/xxx
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/load-balancer-attributes: |
      idle_timeout.timeout_seconds=60
      routing.http.desync_mitigation_mode=defensive
    # Global Accelerator
    alb.ingress.kubernetes.io/global-accelerator: "true"
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - api.mukti.ai
        - app.mukti.ai
      secretName: mukti-tls
  rules:
    - host: api.mukti.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mukti-backend
                port:
                  number: 80
    - host: app.mukti.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mukti-frontend
                port:
                  number: 80
---
# Cross-region DNS routing
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: mukti-global-dns
  namespace: mukti
spec:
  endpoints:
    - dnsName: api.mukti.ai
      recordType: A
      targets:
        - mukti-us-east-alb.us-east-1.elb.amazonaws.com
      recordTTL: 60
    - dnsName: api.mukti.ai
      recordType: A
      targets:
        - mukti-eu-west-alb.eu-west-1.elb.amazonaws.com
      recordTTL: 60
      setIdentifier: eu-west-1
      setIdentifierWeight: 50
