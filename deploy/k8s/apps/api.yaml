# k8s/apps/api.yaml
# MUKTI API deployed via Helm, tracked by ArgoCD
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mukti-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mukti
  source:
    repoURL: https://github.com/mukti-foundation/mukti
    targetRevision: main
    path: k8s/helm/mukti
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
      parameters:
        - name: image.tag
          value: "5.0.0"
  destination:
    server: https://kubernetes.default.svc
    namespace: mukti
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  # Ignore runtime-only fields that cause diff noise
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas   # HPA owns this
