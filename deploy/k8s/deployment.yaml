# ═══════════════════════════════════════════════════════════
# FORMAL GUARANTEES:
# 
# GUARANTEE-1 (Availability):
#   availableReplicas ≥ minReplicas = 3 at all times
#   (enforced by HPA + PodDisruptionBudget)
# 
# GUARANTEE-2 (Resource Safety):
#   Σ container.requests ≤ node.allocatable
#   (enforced by scheduler)
# 
# GUARANTEE-3 (Rollback Safety):
#   Canary analysis gates rollout — if error rate > 5%,
#   automatic rollback (proven by Argo Rollouts)
# 
# GUARANTEE-4 (Zero Downtime):
#   RollingUpdate with maxUnavailable=0 ensures
#   service continuity during updates
# ═══════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mukti-backend
  labels:
    app: mukti-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Allow 1 extra pod during update
      maxUnavailable: 0  # ZERO downtime guarantee
  selector:
    matchLabels:
      app: mukti-backend
  template:
    metadata:
      labels:
        app: mukti-backend
    spec:
      containers:
        - name: backend
          image: mukti/backend:1.0.0
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: "100m"      # 0.1 CPU
              memory: "128Mi"
            limits:
              cpu: "500m"      # 0.5 CPU
              memory: "512Mi"
          # LIVENESS: Is the process alive?
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # READINESS: Can this pod serve traffic?
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mukti-secrets
                  key: database-url
---
apiVersion: v1
kind: Service
metadata:
  name: mukti-backend
spec:
  selector:
    app: mukti-backend
  ports:
    - port: 80
      targetPort: 3001
  type: ClusterIP
---
# ═══════════════════════════════════════════════════════════
# HPA: Autoscale based on CPU utilization
# 
# THEOREM: Under load L(t), replica count R(t) converges to
# R* = ⌈L(t) / targetUtilization⌉ within stabilization window.
# ═══════════════════════════════════════════════════════════
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mukti-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mukti-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Prevent flapping
---
# ═══════════════════════════════════════════════════════════
# PodDisruptionBudget: Guarantees min available during 
# voluntary disruptions (node drains, upgrades)
# 
# PROOF: With maxUnavailable=0 in RollingUpdate and 
# minAvailable=2 here, at least 2 pods always serve traffic.
# ═══════════════════════════════════════════════════════════
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mukti-backend-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mukti-backend
