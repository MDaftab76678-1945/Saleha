# k8s/monitoring/grafana-dashboard-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: mukti-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  mukti-overview.json: |-
    {
      "title": "MUKTI Overview",
      "uid": "mukti-overview",
      "panels": [
        {
          "title": "Active Agents",
          "type": "stat",
          "targets": [{"expr": "sum(mukti_active_agents)"}]
        },
        {
          "title": "Task Rate",
          "type": "graph",
          "targets": [{"expr": "sum(rate(mukti_tasks_total[5m]))"}]
        },
        {
          "title": "Error Rate",
          "type": "graph",
          "targets": [{"expr": "sum(rate(mukti_tasks_total{status=\"failure\"}[5m])) / sum(rate(mukti_tasks_total[5m]))"}]
        },
        {
          "title": "LLM Latency P99",
          "type": "graph",
          "targets": [{"expr": "histogram_quantile(0.99, sum(rate(mukti_llm_latency_seconds_bucket[5m])) by (le))"}]
        }
      ]
    }
