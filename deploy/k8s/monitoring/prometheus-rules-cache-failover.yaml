# k8s/monitoring/prometheus-rules-cache-failover.yaml
# Alerting rules for semantic cache + multi-region failover
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mukti-cache-failover-alerts
  namespace: mukti-monitoring
  labels:
    app: mukti
    release: kube-prometheus-stack
spec:
  groups:
    # ════════════════════════════════════════════
    # SEMANTIC CACHE ALERTS
    # ════════════════════════════════════════════
    - name: mukti.cache
      rules:
        # ── Performance ──
        - alert: MuktiCacheHitRateLow
          expr: |
            (
              sum(rate(mukti_cache_hits_total[15m]))
              /
              (sum(rate(mukti_cache_hits_total[15m])) + sum(rate(mukti_cache_misses_total[15m])))
            ) < 0.30
            and
            (sum(rate(mukti_cache_hits_total[15m])) + sum(rate(mukti_cache_misses_total[15m]))) > 0.1
          for: 15m
          labels:
            severity: warning
            service: cache
            slack: "true"
          annotations:
            summary: "Semantic cache hit rate < 30%"
            description: |
              Cache hit rate is {{ $value | humanizePercentage }} over the last 15m.
              This means most prompts are not being served from cache, increasing
              LLM cost. Check similarity threshold and cache population.
            runbook_url: "https://docs.mukti.ai/runbooks/cache-hit-rate"

        - alert: MuktiCacheHitRateCritical
          expr: |
            (
              sum(rate(mukti_cache_hits_total[15m]))
              /
              (sum(rate(mukti_cache_hits_total[15m])) + sum(rate(mukti_cache_misses_total[15m])))
            ) < 0.10
            and
            (sum(rate(mukti_cache_hits_total[15m])) + sum(rate(mukti_cache_misses_total[15m]))) > 0.5
          for: 15m
          labels:
            severity: critical
            service: cache
            pagerduty: "true"
          annotations:
            summary: "Semantic cache nearly ineffective (< 10% hit rate)"
            description: |
              Cache hit rate dropped to {{ $value | humanizePercentage }}.
              Cache may be broken, evicting too aggressively, or embedder failing.
            runbook_url: "https://docs.mukti.ai/runbooks/cache-hit-rate"

        # ── Capacity ──
        - alert: MuktiCacheEvictionsHigh
          expr: |
            sum(rate(mukti_cache_evictions_total[10m])) > 1
          for: 10m
          labels:
            severity: warning
            service: cache
            slack: "true"
          annotations:
            summary: "High cache eviction rate"
            description: |
              Evicting {{ $value }} entries/sec. Cache may be undersized for the
              working set. Consider raising max_entries or TTL.
            runbook_url: "https://docs.mukti.ai/runbooks/cache-capacity"

        - alert: MuktiCacheNearCapacity
          expr: |
            mukti_cache_entries > 0.90 * 1000
          for: 10m
          labels:
            severity: warning
            service: cache
            slack: "true"
          annotations:
            summary: "Cache approaching max_entries"
            description: "Cache has {{ $value }} entries (> 90% of limit). LRU evictions will increase."

        # ── Embedder health ──
        - alert: MuktiEmbeddingErrorsHigh
          expr: |
            sum(rate(mukti_cache_embed_errors_total[5m])) > 0.1
          for: 5m
          labels:
            severity: critical
            service: cache
            pagerduty: "true"
          annotations:
            summary: "Embedding generation failing"
            description: |
              Embedding errors at {{ $value }}/sec. OpenAI API may be down or
              API key invalid. Cache is falling back to local embedder
              (lower quality matching).
            runbook_url: "https://docs.mukti.ai/runbooks/embedding-errors"

        - alert: MuktiEmbeddingLatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum(rate(mukti_cache_embed_latency_seconds_bucket[5m])) by (le, embedder)
            ) > 1.0
          for: 10m
          labels:
            severity: warning
            service: cache
            slack: "true"
          annotations:
            summary: "Embedding latency p95 > 1s ({{ $labels.embedder }})"
            description: |
              Embedding p95 latency is {{ $value }}s. If using OpenAIEmbedder,
              check API status. Slow embeddings delay every cache lookup.

        # ── Cost savings ──
        - alert: MuktiCacheSavingsDropped
          expr: |
            sum(rate(mukti_cache_savings_usd_total[1h]))
            < 0.25 * sum(rate(mukti_cache_savings_usd_total[1h] offset 1d))
            and
            sum(rate(mukti_cache_savings_usd_total[1h] offset 1d)) > 0.01
          for: 30m
          labels:
            severity: warning
            service: cache
            slack: "true"
          annotations:
            summary: "Cache cost savings dropped > 75% vs yesterday"
            description: |
              Current savings ${{ $value }}/h is less than 25% of yesterday's rate.
              Cache effectiveness has degraded – investigate.

    # ════════════════════════════════════════════
    # MULTI-REGION FAILOVER ALERTS
    # ════════════════════════════════════════════
    - name: mukti.failover
      rules:
        # ── Failover state ──
        - alert: MuktiFailoverActive
          expr: mukti_failover_state == 1
          for: 1m
          labels:
            severity: critical
            service: failover
            pagerduty: "true"
          annotations:
            summary: "MUKTI has FAILED OVER to secondary region"
            description: |
              Traffic is being served by the secondary region. The primary
              region is unhealthy. Follow IR-07 (Region Failover) runbook.
              Investigate primary region immediately.
            runbook_url: "https://docs.mukti.ai/runbooks/region-failover"

        - alert: MuktiFailbackInProgress
          expr: mukti_failover_state == 2
          for: 1m
          labels:
            severity: warning
            service: failover
            slack: "true"
          annotations:
            summary: "Failback to primary region in progress"
            description: "Primary has recovered and traffic is returning. Monitor closely."

        # ── Region health ──
        - alert: MuktiRegionUnhealthy
          expr: mukti_failover_health{region!="secondary"} == 0
          for: 2m
          labels:
            severity: critical
            service: failover
            pagerduty: "true"
          annotations:
            summary: "Region {{ $labels.region }} is UNHEALTHY"
            description: |
              Health checks failing for region {{ $labels.region }} for 2m.
              Consecutive failures: check mukti_failover_consecutive_failures.
            runbook_url: "https://docs.mukti.ai/runbooks/region-health"

        - alert: MuktiRegionDegraded
          expr: mukti_failover_health == 0.5
          for: 5m
          labels:
            severity: warning
            service: failover
            slack: "true"
          annotations:
            summary: "Region {{ $labels.region }} is DEGRADED"
            description: |
              Region {{ $labels.region }} is up but responding slowly or
              partially. Investigate before it becomes unhealthy.

        - alert: MuktiBothRegionsDegraded
          expr: |
            mukti_failover_health{region="primary"} <= 0.5
            and
            mukti_failover_health{region="secondary"} <= 0.5
          for: 2m
          labels:
            severity: critical
            service: failover
            pagerduty: "true"
          annotations:
            summary: "🔴 BOTH regions degraded/unhealthy – potential total outage"
            description: |
              Both primary and secondary regions are degraded. This is a
              SEV-1 incident. There is no healthy failover target.
              Escalate immediately per IR-07.
            runbook_url: "https://docs.mukti.ai/runbooks/total-outage"

        # ── Health check infrastructure ──
        - alert: MuktiHealthCheckLatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum(rate(mukti_failover_health_latency_seconds_bucket[5m])) by (le, region)
            ) > 2.0
          for: 10m
          labels:
            severity: warning
            service: failover
            slack: "true"
          annotations:
            summary: "Health check latency high for {{ $labels.region }}"
            description: |
              Health check p95 latency is {{ $value }}s for {{ $labels.region }}.
              Either the region is slow or the health check path is overloaded.

        - alert: MuktiHealthChecksStopped
          expr: |
            sum(rate(mukti_failover_health_checks_total[5m])) == 0
          for: 5m
          labels:
            severity: critical
            service: failover
            pagerduty: "true"
          annotations:
            summary: "Failover health checks have STOPPED"
            description: |
              No health checks recorded in 5m. The failover controller may be
              down. Without health checks, automatic failover will NOT work.
              Restart the controller immediately.
            runbook_url: "https://docs.mukti.ai/runbooks/failover-controller"

        # ── Flapping detection ──
        - alert: MuktiFailoverFlapping
          expr: |
            sum(increase(mukti_failover_transitions_total[1h])) > 2
          for: 5m
          labels:
            severity: warning
            service: failover
            slack: "true"
          annotations:
            summary: "Failover flapping detected (> 2 transitions/hour)"
            description: |
              {{ $value }} failover transitions in the last hour. Repeated
              failover/failback indicates unstable health checks or a
              flapping region. Review cooldown and thresholds.
            runbook_url: "https://docs.mukti.ai/runbooks/failover-flapping"

        # ── Consecutive failures warning ──
        - alert: MuktiConsecutiveFailuresRising
          expr: mukti_failover_consecutive_failures >= 2
          for: 1m
          labels:
            severity: warning
            service: failover
            slack: "true"
          annotations:
            summary: "Region {{ $labels.region }} has {{ $value }} consecutive failures"
            description: |
              Approaching failover threshold. If failures continue, automatic
              failover will trigger. Stand by.

    # ════════════════════════════════════════════
    # COST OPTIMIZATION ALERTS
    # ════════════════════════════════════════════
    - name: mukti.cost
      rules:
        - alert: MuktiCostSpike
          expr: |
            sum(rate(mukti_cost_usd_total[1h]))
            > 3 * sum(rate(mukti_cost_usd_total[1h] offset 1d))
            and
            sum(rate(mukti_cost_usd_total[1h] offset 1d)) > 0.01
          for: 30m
          labels:
            severity: warning
            service: cost
            slack: "true"
          annotations:
            summary: "LLM cost spike (3x daily baseline)"
            description: |
              Current cost rate ${{ $value }}/h is 3x yesterday's baseline.
              Check for runaway agents or cache failures.
            runbook_url: "https://docs.mukti.ai/runbooks/cost-spike"

        - alert: MuktiDailyBudgetExceeded
          expr: |
            sum(increase(mukti_cost_usd_total[24h])) > 50
          for: 5m
          labels:
            severity: critical
            service: cost
            pagerduty: "true"
          annotations:
            summary: "Daily LLM budget exceeded ($50)"
            description: |
              Spent ${{ $value }} in the last 24h, exceeding the $50 daily budget.
              Run 'mukti cost optimize' for savings recommendations.
