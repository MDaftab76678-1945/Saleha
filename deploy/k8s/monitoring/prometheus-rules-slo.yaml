# k8s/monitoring/prometheus-rules-slo.yaml
# SLO recording rules + multi-window burn-rate alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mukti-slo-rules
  namespace: mukti-monitoring
  labels:
    app: mukti
    release: kube-prometheus-stack
spec:
  groups:
    # ════════════════════════════════════════
    # Recording rules (SLIs + budget math)
    # ════════════════════════════════════════
    - name: mukti.slo.recording
      interval: 30s
      rules:
        # ── Availability SLI: error ratios at alert windows ──
        - record: mukti_slo:availability_error_ratio:rate5m
          expr: |
            sum(rate(http_requests_total{job="mukti-api",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="mukti-api"}[5m]))
        - record: mukti_slo:availability_error_ratio:rate30m
          expr: |
            sum(rate(http_requests_total{job="mukti-api",status=~"5.."}[30m]))
            /
            sum(rate(http_requests_total{job="mukti-api"}[30m]))
        - record: mukti_slo:availability_error_ratio:rate1h
          expr: |
            sum(rate(http_requests_total{job="mukti-api",status=~"5.."}[1h]))
            /
            sum(rate(http_requests_total{job="mukti-api"}[1h]))
        - record: mukti_slo:availability_error_ratio:rate2h
          expr: |
            sum(rate(http_requests_total{job="mukti-api",status=~"5.."}[2h]))
            /
            sum(rate(http_requests_total{job="mukti-api"}[2h]))
        - record: mukti_slo:availability_error_ratio:rate6h
          expr: |
            sum(rate(http_requests_total{job="mukti-api",status=~"5.."}[6h]))
            /
            sum(rate(http_requests_total{job="mukti-api"}[6h]))
        - record: mukti_slo:availability_error_ratio:rate3d
          expr: |
            sum(rate(http_requests_total{job="mukti-api",status=~"5.."}[3d]))
            /
            sum(rate(http_requests_total{job="mukti-api"}[3d]))

        # ── 30-day window: budget consumption ──
        - record: mukti_slo:availability_error_ratio:ratio30d
          expr: |
            sum(increase(http_requests_total{job="mukti-api",status=~"5.."}[30d]))
            /
            sum(increase(http_requests_total{job="mukti-api"}[30d]))

        # Budget consumed fraction (target 99.9% → budget 0.001)
        - record: mukti_slo:error_budget_consumed:ratio30d
          expr: |
            clamp_max(
              mukti_slo:availability_error_ratio:ratio30d / 0.001,
              1
            )

        # Budget remaining fraction (for the burn-down chart)
        - record: mukti_slo:error_budget_remaining:ratio30d
          expr: |
            clamp_min(
              1 - mukti_slo:error_budget_consumed:ratio30d,
              0
            )

        # ── Latency SLI: fraction of requests SLOWER than 2s ──
        - record: mukti_slo:latency_slow_ratio:rate5m
          expr: |
            1 - (
              sum(rate(http_request_duration_seconds_bucket{job="mukti-api",le="2"}[5m]))
              /
              sum(rate(http_request_duration_seconds_count{job="mukti-api"}[5m]))
            )
        - record: mukti_slo:latency_slow_ratio:rate1h
          expr: |
            1 - (
              sum(rate(http_request_duration_seconds_bucket{job="mukti-api",le="2"}[1h]))
              /
              sum(rate(http_request_duration_seconds_count{job="mukti-api"}[1h]))
            )

    # ════════════════════════════════════════
    # Multi-window burn-rate alerts
    # ════════════════════════════════════════
    - name: mukti.slo.burn-rate
      rules:
        # 14.4x burn – 30d budget exhausted in ~1 hour → PAGE
        - alert: MuktiSLOBurnFast1h
          expr: |
            mukti_slo:availability_error_ratio:rate1h > (14.4 * 0.001)
            and
            mukti_slo:availability_error_ratio:rate5m > (14.4 * 0.001)
          for: 2m
          labels:
            severity: critical
            service: slo
            pagerduty: "true"
          annotations:
            summary: "🔴 SLO fast burn – budget exhausted in ~1h"
            description: |
              Availability burn rate > 14.4x (both 5m and 1h windows).
              At this pace the 30-day error budget is gone in ~1 hour.
            runbook_url: "https://docs.mukti.ai/runbooks/region-failover"

        # 6x burn – budget exhausted in ~4 hours → PAGE
        - alert: MuktiSLOBurnFast6h
          expr: |
            mukti_slo:availability_error_ratio:rate6h > (6 * 0.001)
            and
            mukti_slo:availability_error_ratio:rate30m > (6 * 0.001)
          for: 15m
          labels:
            severity: critical
            service: slo
            pagerduty: "true"
          annotations:
            summary: "🔴 SLO fast burn – budget exhausted in ~4h"
            description: "Availability burn rate > 6x on both 30m and 6h windows."

        # 3x burn – budget exhausted in ~10 hours → ticket
        - alert: MuktiSLOBurnSlow3d
          expr: |
            mukti_slo:availability_error_ratio:rate3d > (3 * 0.001)
            and
            mukti_slo:availability_error_ratio:rate2h > (3 * 0.001)
          for: 1h
          labels:
            severity: warning
            service: slo
            slack: "true"
          annotations:
            summary: "🟡 SLO slow burn – budget exhausted in ~10h"
            description: "Sustained 3x burn rate. Investigate within the day."

        # Budget nearly exhausted (regardless of current rate)
        - alert: MuktiSLOBudgetNearlyExhausted
          expr: mukti_slo:error_budget_remaining:ratio30d < 0.10
          for: 30m
          labels:
            severity: warning
            service: slo
            slack: "true"
          annotations:
            summary: "⚠️ Error budget < 10% remaining (30d window)"
            description: |
              Only {{ $value | humanizePercentage }} of the 30-day error
              budget remains. Consider a change freeze.

        - alert: MuktiSLOBudgetExhausted
          expr: mukti_slo:error_budget_remaining:ratio30d == 0
          for: 5m
          labels:
            severity: critical
            service: slo
            pagerduty: "true"
          annotations:
            summary: "🚨 30-day error budget EXHAUSTED"
            description: |
              The availability SLO has been violated for this window.
              Freeze non-critical changes until the budget recovers.

        # Latency SLO burn (99% under 2s → slow budget 0.01)
        - alert: MuktiSLOLatencyBurn
          expr: |
            mukti_slo:latency_slow_ratio:rate1h > (14.4 * 0.01)
            and
            mukti_slo:latency_slow_ratio:rate5m > (14.4 * 0.01)
          for: 5m
          labels:
            severity: warning
            service: slo
            slack: "true"
          annotations:
            summary: "Latency SLO fast burn (> 14.4x)"
            description: "Too many requests exceeding the 2s latency target."
