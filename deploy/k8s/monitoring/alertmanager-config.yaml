# k8s/monitoring/alertmanager-config.yaml
# AlertmanagerConfig (CRD) – routes MUKTI alerts to Slack/PagerDuty
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: mukti-alerts
  namespace: mukti-monitoring
  labels:
    release: kube-prometheus-stack   # Must match the Prometheus operator's selector
spec:
  # ── Receivers ──────────────────────────────
  receivers:
    # Default sink (blackhole-ish, low noise)
    - name: "mukti-default"
      webhookConfigs:
        - url: "http://localhost:9095"   # placeholder no-op
          sendResolved: false

    # Slack for warnings + info
    - name: "mukti-slack"
      slackConfigs:
        - apiURL:
            name: mukti-slack-webhook
            key: url
          channel: "#mukti-alerts"
          sendResolved: true
          title: '{{ template "slack.title" . }}'
          text: >-
            {{ range .Alerts }}
            *{{ .Labels.severity | toUpper }}* — {{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}
            {{ end }}

    # PagerDuty for critical (pages on-call)
    - name: "mukti-pagerduty"
      pagerdutyConfigs:
        - routingKey:
            name: mukti-pagerduty-key
            key: routing-key
          severity: critical
          description: '{{ .CommonAnnotations.summary }}'
          details:
            - key: service
              value: '{{ .CommonLabels.service }}'
            - key: runbook
              value: '{{ .CommonAnnotations.runbook_url }}'

    # Slack for critical too (visibility without paging)
    - name: "mukti-slack-critical"
      slackConfigs:
        - apiURL:
            name: mukti-slack-webhook
            key: url
          channel: "#mukti-incidents"
          sendResolved: true
          title: "🔴 {{ .CommonLabels.alertname }}"
          text: >-
            {{ range .Alerts }}
            {{ .Annotations.summary }} — {{ .Annotations.description }}
            {{ end }}

  # ── Routing tree ───────────────────────────
  route:
    receiver: "mukti-default"
    groupBy: ["alertname", "service"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      # Critical → PagerDuty + Slack incidents channel
      - matchers:
          - name: severity
            value: critical
            matchType: "="
        receiver: "mukti-pagerduty"
        repeatInterval: 1h       # Re-page hourly while firing
        continue: true           # Also send to Slack below

      - matchers:
          - name: severity
            value: critical
            matchType: "="
        receiver: "mukti-slack-critical"
        repeatInterval: 1h

      # Warning → Slack alerts channel only
      - matchers:
          - name: severity
            value: warning
            matchType: "="
        receiver: "mukti-slack"
        repeatInterval: 12h

  # ── Inhibition ─────────────────────────────
  # If API is fully down, suppress per-pod infra noise
  inhibitRules:
    - sourceMatch:
        - name: alertname
          value: MuktiApiDown
          matchType: "="
      targetMatch:
        - name: alertname
          value: MuktiPodNotReady
          matchType: "="
      equal: ["namespace"]
