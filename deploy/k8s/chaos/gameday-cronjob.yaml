# k8s/chaos/gameday-cronjob.yaml
# Weekly automated DR game-day
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mukti-gameday
  namespace: mukti
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mukti-gameday
  namespace: mukti
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "deployments", "statefulsets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosresults"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mukti-gameday
  namespace: mukti
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mukti-gameday
subjects:
  - kind: ServiceAccount
    name: mukti-gameday
    namespace: mukti
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mukti-dr-gameday
  namespace: mukti
spec:
  schedule: "0 10 * * 3"          # Wednesdays 10:00 UTC
  concurrencyPolicy: Forbid        # never overlap game days
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 8    # keep 8 weeks of history
  failedJobsHistoryLimit: 8
  jobTemplate:
    spec:
      backoffLimit: 0              # no auto-retry of chaos
      activeDeadlineSeconds: 10800 # hard cap: 3 hours
      template:
        spec:
          serviceAccountName: mukti-gameday
          restartPolicy: Never
          containers:
            - name: gameday
              image: ghcr.io/mukti-foundation/mukti-api:5.1.0
              command: ["python", "-m", "mukti.chaos.drills.scheduler"]
              env:
                - name: DRILL_DRY_RUN
                  value: "false"              # real execution
                - name: DRILL_APPROVAL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: mukti-drill-approval
                      key: token
                - name: SLACK_CHAOS_WEBHOOK
                  valueFrom:
                    secretKeyRef:
                      name: mukti-slack-webhook
                      key: url
                - name: PROMETHEUS_URL
                  value: "http://prometheus-k8s.mukti-monitoring.svc:9090"
                - name: DRILL_API_URLS
                  value: "http://mukti-api.mukti.svc:8000"
                - name: CONTEXT_US
                  value: "mukti-us-east-1"
                - name: CONTEXT_EU
                  value: "mukti-eu-west-1"
                # Freeze example: uncomment to pause drills
                # - name: DRILL_FREEZE_UNTIL
                #   value: "2026-07-01"
              volumeMounts:
                - name: reports
                  mountPath: /app/drill-reports
          volumes:
            - name: reports
              emptyDir: {}
