apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: mukti-network-partition
  namespace: mukti
spec:
  appinfo:
    appns: mukti
    applabel: "app=mukti-api"
    appkind: deployment
  engineState: active
  chaosServiceAccount: chaos-runner
  experiments:
    - name: pod-network-loss
      spec:
        components:
          env:
            - name: NETWORK_PACKET_LOSS_PERCENTAGE
              value: "100"
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            # Scope: only break egress to the writer region
            - name: DESTINATION_HOSTS
              value: ""   # set writer CIDR to scope precisely
