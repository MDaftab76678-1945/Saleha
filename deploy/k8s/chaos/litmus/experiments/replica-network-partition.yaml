# k8s/chaos/litmus/experiments/replica-network-partition.yaml
# APPLY IN THE READER CLUSTER – 100% packet loss on the replica,
# breaking the replication stream without killing the pod.
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: mukti-replica-network-partition
  namespace: mukti
spec:
  appinfo:
    appns: mukti
    applabel: "app.kubernetes.io/name=postgresql"
    appkind: statefulset
  engineState: active
  chaosServiceAccount: chaos-runner
  experiments:
    - name: pod-network-loss
      spec:
        components:
          env:
            - name: NETWORK_PACKET_LOSS_PERCENTAGE
              value: "100"
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            - name: NETWORK_INTERFACE
              value: "eth0"
            # Only break traffic toward the writer (replication stream)
            - name: DESTINATION_HOSTS
              value: ""   # empty = all egress; set writer CIDR to scope
