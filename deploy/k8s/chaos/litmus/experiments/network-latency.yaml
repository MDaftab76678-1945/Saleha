# k8s/chaos/litmus/experiments/network-latency.yaml
# Validates IR-04 (LLM provider latency/outage simulation)
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: mukti-network-latency
  namespace: mukti
spec:
  appinfo:
    appns: mukti
    applabel: app.kubernetes.io/name=mukti
    appkind: deployment
  engineState: active
  chaosServiceAccount: chaos-runner
  experiments:
    - name: pod-network-latency
      spec:
        probe:
          # Probe: agent tasks should degrade gracefully, not fail hard
          - name: api-still-responds
            type: httpProbe
            httpProbe/inputs:
              url: "http://mukti-api.mukti.svc:8000/health"
              method:
                get:
                  criteria: ==
                  responseCode: "200"
            mode: Continuous
            runProperties:
              probeTimeout: 15   # Generous timeout under latency
        components:
          env:
            - name: NETWORK_LATENCY
              value: "2000"       # 2000ms latency
            - name: JITTER
              value: "500"        # ±500ms jitter
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            - name: PODS_AFFECTED_PERC
              value: "100"
