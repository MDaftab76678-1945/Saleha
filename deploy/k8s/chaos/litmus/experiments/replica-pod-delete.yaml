# k8s/chaos/litmus/experiments/replica-pod-delete.yaml
# APPLY IN THE READER CLUSTER – kills the read replica mid-test.
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: mukti-replica-pod-delete
  namespace: mukti
spec:
  appinfo:
    appns: mukti
    applabel: "app.kubernetes.io/name=postgresql"
    appkind: statefulset
  engineState: active
  chaosServiceAccount: chaos-runner
  experiments:
    - name: pod-delete
      spec:
        probe:
          # Writer must stay healthy during replica kill
          - name: writer-health
            type: httpProbe
            httpProbe/inputs:
              url: "http://mukti-api.mukti.svc:8000/health"
              method:
                get:
                  criteria: ==
                  responseCode: "200"
            mode: Continuous
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            - name: CHAOS_INTERVAL
              value: "30"
            - name: FORCE
              value: "true"      # Simulate crash, not graceful stop
            - name: PODS_AFFECTED_PERC
              value: "100"
