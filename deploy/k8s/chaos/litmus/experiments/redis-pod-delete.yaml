# k8s/chaos/litmus/experiments/redis-pod-delete.yaml
# Validates IR-03 (redis failure – cache is tolerable)
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: mukti-redis-pod-delete
  namespace: mukti
spec:
  appinfo:
    appns: mukti
    applabel: app.kubernetes.io/name=redis
    appkind: statefulset
  engineState: active
  chaosServiceAccount: chaos-runner
  experiments:
    - name: pod-delete
      spec:
        probe:
          # Probe: API must stay UP even if cache is lost
          - name: api-survives-cache-loss
            type: httpProbe
            httpProbe/inputs:
              url: "http://mukti-api.mukti.svc:8000/health"
              method:
                get:
                  criteria: ==
                  responseCode: "200"
            mode: Continuous
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: FORCE
              value: "true"
