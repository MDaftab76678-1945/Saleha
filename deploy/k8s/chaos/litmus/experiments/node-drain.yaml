# k8s/chaos/litmus/experiments/node-drain.yaml
# Validates HA: pods reschedule, PDB respected, no downtime
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: mukti-node-drain
  namespace: mukti
spec:
  appinfo:
    appns: mukti
    applabel: app.kubernetes.io/name=mukti
    appkind: deployment
  engineState: active
  chaosServiceAccount: chaos-runner
  experiments:
    - name: node-drain
      spec:
        probe:
          # Probe: API must stay available during drain
          - name: api-available-during-drain
            type: httpProbe
            httpProbe/inputs:
              url: "http://mukti-api.mukti.svc:8000/health"
              method:
                get:
                  criteria: ==
                  responseCode: "200"
            mode: Continuous
          # Probe: PDB must prevent full disruption
          - name: pdb-respected
            type: k8sProbe
            k8sProbe/inputs:
              group: policy
              version: v1
              resource: poddisruptionbudgets
              namespace: mukti
              fieldSelector: status.disruptionsAllowed>=0
              labelSelector: app.kubernetes.io/name=mukti
            mode: OnChaos
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            - name: NODE_LABEL
              value: "mukti-worker=true"
