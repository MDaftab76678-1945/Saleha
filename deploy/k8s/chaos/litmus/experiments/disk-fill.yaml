# k8s/chaos/litmus/experiments/disk-fill.yaml
# Validates IR-06 (PVC almost full → alert fires)
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: mukti-disk-fill
  namespace: mukti
spec:
  appinfo:
    appns: mukti
    applabel: app.kubernetes.io/name=mukti
    appkind: deployment
  engineState: active
  chaosServiceAccount: chaos-runner
  experiments:
    - name: disk-fill
      spec:
        probe:
          # Probe: MuktiPVCAlmostFull alert should fire
          - name: pvc-alert-fires
            type: promProbe
            promProbe/inputs:
              query: "kubelet_volume_stats_used_bytes{namespace='mukti'} / kubelet_volume_stats_capacity_bytes{namespace='mukti'} > 0.85"
              comparator:
                criteria: ">"
                value: "0"
            mode: OnChaos
            runProperties:
              probeTimeout: 60
              interval: 15
        components:
          env:
            - name: FILL_PERCENTAGE
              value: "90"        # Fill to 90%
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            - name: TARGET_PODS
              value: "mukti-api"
