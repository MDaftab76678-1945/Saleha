# Helper manifest: not Litmus-driven (corruption needs DB-level commands).
# The injector runs psql directly; this manifest is a no-op placeholder
# documenting the drill. Actual logic is in DBCorruptionInjector.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mukti-db-corruption-drill
  namespace: mukti
data:
  description: |
    Drill 3: corrupt drill_corruption_test table, then restore.
    Safety: only touches the dedicated drill table, never prod data.
    Restore tested via pg_restore from latest backup.
