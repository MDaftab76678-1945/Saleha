# k8s/chaos/litmus/experiments/postgres-pod-delete.yaml
# Validates IR-02 (database failure recovery)
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: mukti-postgres-pod-delete
  namespace: mukti
spec:
  appinfo:
    appns: mukti
    applabel: app.kubernetes.io/name=postgresql
    appkind: statefulset
  engineState: active
  chaosServiceAccount: chaos-runner
  experiments:
    - name: pod-delete
      spec:
        probe:
          # Probe: memory endpoints must recover after DB restart
          - name: memory-store-recovers
            type: httpProbe
            httpProbe/inputs:
              url: "http://mukti-api.mukti.svc:8000/health"
              method:
                get:
                  criteria: ==
                  responseCode: "200"
            mode: OnChaos   # Only check DURING chaos
            runProperties:
              probeTimeout: 30
              interval: 10
              retry: 10     # Allow retries – DB restart takes time
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "90"
            - name: CHAOS_INTERVAL
              value: "30"
            - name: FORCE
              value: "true"   # Force kill to simulate crash
