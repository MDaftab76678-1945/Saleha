# k8s/approval/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mukti-approval-service
  namespace: mukti-monitoring
spec:
  replicas: 1   # single replica (in-memory store); use Redis store for HA
  selector:
    matchLabels:
      app: mukti-approval-service
  template:
    metadata:
      labels:
        app: mukti-approval-service
    spec:
      containers:
        - name: service
          image: ghcr.io/mukti-foundation/mukti-api:5.0.0
          command: ["uvicorn", "mukti.deploy.approval_service:app"]
          args: ["--host", "0.0.0.0", "--port", "8090"]
          ports:
            - containerPort: 8090
          env:
            - name: SLACK_BOT_TOKEN
              valueFrom: {secretKeyRef: {name: mukti-slack-bot, key: token}}
            - name: SLACK_SIGNING_SECRET
              valueFrom: {secretKeyRef: {name: mukti-slack-bot, key: signing-secret}}
            - name: SLACK_APPROVAL_CHANNEL
              value: "#deployments"
            - name: APPROVAL_TTL_MINUTES
              value: "30"
          readinessProbe:
            httpGet: {path: /pending, port: 8090}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 200m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mukti-approval-service
  namespace: mukti-monitoring
spec:
  selector:
    app: mukti-approval-service
  ports:
    - port: 8090
      targetPort: 8090
---
# Expose /slack/interactions to the internet (Slack must reach it)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mukti-approval-slack
  namespace: mukti-monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [approval.mukti.ai]
      secretName: approval-tls
  rules:
    - host: approval.mukti.ai
      http:
        paths:
          - path: /slack/interactions
            pathType: Prefix
            backend:
              service:
                name: mukti-approval-service
                port: {number: 8090}
