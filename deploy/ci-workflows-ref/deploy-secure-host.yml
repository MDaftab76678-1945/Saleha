name: NEXUS v8 Secure Build & Gramine Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nexus-host

jobs:
  build-and-attest:
    runs-on: ubuntu-22.04 # Use specific runner for reproducibility
    permissions:
      id-token: write
      packages: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust & Dependencies
        run: |
          rustup target add riscv32im-risc0-zkvm-elf
          sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build zkVM Guest (Reproducible)
        run: |
          cd rust-host/guest
          cargo build --release --target riscv32im-risc0-zkvm-elf

      - name: Build Rust Host
        run: |
          cd rust-host
          cargo build --release

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: ./rust-host
          format: cyclonedx-json
          output-file: nexus-host-sbom.json

      - name: Install Cosign & Sign Artifacts
        uses: sigstore/cosign-installer@v3
      - name: Sign Binary and SBOM
        run: |
          cosign sign-blob --yes rust-host/target/release/nexus-rust-host > host.sig
          cosign sign-blob --yes nexus-host-sbom.json > sbom.sig

      - name: Install Gramine
        run: |
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:gramine/dev
          sudo apt-get update
          sudo apt-get install -y gramine

      - name: Sign Gramine Manifest
        run: |
          # Replace placeholders in template
          sed "s|{{ gramine.libos }}|/usr/lib/x86_64-linux-gnu/gramine/libos.so|g" \
              nexus-host.manifest.template > nexus-host.manifest
          
          # Generate signing key (in production, use a secure HSM or KMS)
          gramine-sgx-gen-private-key
          
          # Sign the manifest (this hashes the protected files into the quote)
          gramine-sgx-sign --manifest nexus-host.manifest --output nexus-host.manifest.sgx

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.gramine
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          annotations: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
