name: NEXUS CI/CD & TEE Deployment

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nexus-executor-tee

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Run Rust Tests
        run: cargo test --release
        
      - name: Run Clippy & Format Check
        run: |
          cargo clippy -- -D warnings
          cargo fmt -- --check

  build-and-push-tee:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and Push Gramine TEE Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.tee
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-to-tee-node:
    needs: build-and-push-tee
    runs-on: [self-hosted, sgx-enabled] # Requires an SGX-enabled runner (e.g., Azure DCsv3)
    steps:
      - name: Pull and Run Enclave
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker run -d --name nexus-enclave \
            --device /dev/sgx_enclave \
            --device /dev/sgx_provision \
            -p 8080:8080 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
