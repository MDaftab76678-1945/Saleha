name: NEXUS v8 Secure Build & Attestation
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # For Sigstore OIDC
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      # 1. Reproducible Rust Build
      - name: Install Rust and cargo-chef
        run: |
          rustup target add riscv32im-risc0-zkvm-elf
          cargo install cargo-chef
      
      - name: Build zkVM Guest (Reproducible)
        run: |
          cd nexus-zkvm/guest
          cargo chef prepare --recipe-path recipe.json
          cargo chef cook --release --target riscv32im-risc0-zkvm-elf --recipe-path recipe.json
          cargo build --release --target riscv32im-risc0-zkvm-elf

      # 2. SBOM Generation
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./nexus-zkvm
          format: cyclonedx-json
          output-file: nexus-v8-sbom.json

      # 3. Cryptographic Signing (Sigstore/Cosign)
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign Artifacts
        run: |
          cosign sign-blob --yes nexus-zkvm/guest/target/riscv32im-risc0-zkvm-elf/release/guest > guest.sig
          cosign sign-blob --yes nexus-v8-sbom.json > sbom.sig
