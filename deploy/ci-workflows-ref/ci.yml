# .github/workflows/ci.yml
# Runs on every PR and push to main
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check mukti/ tests/

      - name: Ruff format check
        run: ruff format --check mukti/

      - name: MyPy type check
        run: mypy mukti/ --ignore-missing-imports

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ tests/cli/ -v --cov=mukti --cov-report=xml

      - name: Run API tests
        run: pytest tests/api/ -v

      - name: Run integration tests
        run: pytest tests/integration/ -v

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=80

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  rust-tests:
    name: Rust Engine Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-engine/Cargo.lock') }}

      - name: Run Rust tests
        run: cargo test --release

      - name: Clippy lint
        run: cargo clippy -- -D warnings

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Check for hardcoded secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --exclude-files '\.lock$' > secrets.json
          if grep -q '"type"' secrets.json; then
            echo "Potential secrets detected!"
            cat secrets.json
            exit 1
          fi
