name: Rust Tests & Gramine TEE Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      
      - name: Run unit tests
        run: cargo test --all --verbose
      
      - name: Generate coverage report
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --out Xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      
      - name: Run integration tests
        run: cargo test --test integration_test --verbose

  gramine-tee-tests:
    runs-on: [self-hosted, sgx]
    needs: integration-tests
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Gramine
        run: |
          sudo apt-get update
          sudo apt-get install -y gramine
      
      - name: Build enclave
        run: |
          gramine-sgx-gen-private-key
          gramine-sgx-sign --manifest gramine-manifest.template
      
      - name: Run SGX tests
        run: |
          gramine-sgx ./target/release/nexus-executor --test-all

  security-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v3
      
      - name: Run cargo-audit
        run: |
          cargo install cargo-audit
          cargo audit
      
      - name: Run clippy
        run: cargo clippy -- -D warnings
