---
# =============================================================================
# MUKTI Ecosystem - Master Ansible Playbook
# =============================================================================

- name: Configure MUKTI Infrastructure
  hosts: all
  become: yes
  vars:
    environment: "{{ lookup('env', 'MUKTI_ENV') | default('staging', true) }}"
    namespace: "nexus-{{ environment }}"

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

  roles:
    - role: common
      tags: [common]
    - role: docker
      tags: [docker]
    - role: kubernetes
      tags: [kubernetes]
    - role: backend
      tags: [backend]
    - role: monitoring
      tags: [monitoring]

  post_tasks:
    - name: Verify deployment health
      uri:
        url: "http://localhost:8000/health"
        method: GET
        status_code: 200
      register: health_check
      retries: 5
      delay: 10
      until: health_check.status == 200
      tags: [verify]
