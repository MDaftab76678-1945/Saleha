---
- name: Create application namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ namespace }}"

- name: Deploy backend application
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../../kubernetes/overlays/{{ environment }}"
    apply: yes

- name: Wait for backend deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: nexus-backend
    namespace: "{{ namespace }}"
  register: backend_deploy
  until: >
    backend_deploy.resources[0].status.readyReplicas is defined and
    backend_deploy.resources[0].status.readyReplicas >= 1
  retries: 30
  delay: 10

- name: Run database migrations
  kubernetes.core.k8s_exec:
    namespace: "{{ namespace }}"
    pod: "{{ backend_deploy.resources[0].status.readyReplicas | ternary(backend_deploy.resources[0].metadata.name, '') }}"
    container: backend
    command: alembic upgrade head
  when: backend_deploy.resources[0].status.readyReplicas is defined

- name: Verify API health
  uri:
    url: "http://nexus-backend.{{ namespace }}.svc.cluster.local:8000/health"
    method: GET
    status_code: 200
  register: api_health
  retries: 10
  delay: 5
  until: api_health.status == 200
