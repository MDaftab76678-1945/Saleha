---
- name: Add Prometheus Helm repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts

- name: Deploy Prometheus stack
  kubernetes.core.helm:
    name: kube-prometheus
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: monitoring
    create_namespace: yes
    values:
      grafana:
        adminPassword: "{{ grafana_admin_password }}"
        persistence:
          enabled: true
          size: 10Gi
      prometheus:
        prometheusSpec:
          retention: 30d
          storageSpec:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 50Gi
      alertmanager:
        enabled: true

- name: Add Jaeger Helm repository
  kubernetes.core.helm_repository:
    name: jaegertracing
    repo_url: https://jaegertracing.github.io/helm-charts

- name: Deploy Jaeger for distributed tracing
  kubernetes.core.helm:
    name: jaeger
    chart_ref: jaegertracing/jaeger
    release_namespace: monitoring
    values:
      provisionDataStore:
        cassandra: false
      allInOne:
        enabled: true
      storage:
        type: memory

- name: Apply custom MUKTI dashboards
  kubernetes.core.k8s:
    state: present
    src: "{{ item }}"
  with_fileglob:
    - "{{ playbook_dir }}/../../monitoring/grafana/dashboards/*.json"
