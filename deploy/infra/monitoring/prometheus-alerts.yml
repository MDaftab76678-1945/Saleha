groups:
  - name: nexus-security-alerts
    rules:
      - alert: HighRateOfBlockedActions
        expr: rate(nexus_audit_logs_total{action=~"BLOCKED.*"}[5m]) > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High rate of blocked AI actions detected"
          description: "More than 10 blocked actions per minute. Possible active attack."

      - alert: SmartContractSlashingEvent
        expr: increase(nexus_blockchain_transactions_total{type="slash"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Agent slashed on-chain"
          description: "An agent was flagged and slashed for malicious behavior."
