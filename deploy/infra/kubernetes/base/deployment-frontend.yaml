apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-frontend
  labels:
    app: nexus-omni
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-omni
      component: frontend
  template:
    metadata:
      labels:
        app: nexus-omni
        component: frontend
    spec:
      containers:
        - name: frontend
          image: nexus-omni/frontend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: nexus-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
