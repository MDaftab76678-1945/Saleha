apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexus-staging

resources:
  - ../../base/

patchesStrategicMerge:
  - patches/backend-deployment.yaml
  - patches/hpa.yaml

configMapGenerator:
  - name: nexus-config
    literals:
      - APP_ENV=staging
      - LOG_LEVEL=INFO
      - MAX_CONCURRENT_WORKERS=5
      - TOKEN_BUDGET_PER_TASK=8000

images:
  - name: nexus-omni/backend
    newTag: staging-latest
  - name: nexus-omni/frontend
    newTag: staging-latest

replicas:
  - name: nexus-backend
    count: 2
  - name: nexus-frontend
    count: 2
