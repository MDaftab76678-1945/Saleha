apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          env:
            - name: DEBUG
              value: "true"
