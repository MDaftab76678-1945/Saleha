apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexus-dev

resources:
  - ../../base/

patchesStrategicMerge:
  - patches/backend-deployment.yaml
  - patches/frontend-deployment.yaml
  - patches/namespace.yaml

configMapGenerator:
  - name: nexus-config
    literals:
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
      - MAX_CONCURRENT_WORKERS=2
      - TOKEN_BUDGET_PER_TASK=4000

images:
  - name: nexus-omni/backend
    newTag: latest
  - name: nexus-omni/frontend
    newTag: latest

replicas:
  - name: nexus-backend
    count: 1
  - name: nexus-frontend
    count: 1
