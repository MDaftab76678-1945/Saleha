# =============================================================================
# Prometheus Configuration for MUKTI Ecosystem
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Rule files
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Scrape configurations
scrape_configs:
  # Backend API metrics
  - job_name: 'nexus-omni-backend'
    metrics_path: '/metrics'
    scrape_interval: 10s
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - nexus-production
            - nexus-staging
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: nexus-omni
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_component]
        target_label: component
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  # NATS JetStream metrics
  - job_name: 'nats'
    static_configs:
      - targets: ['nats-monitoring:8222']
    metrics_path: '/metrics'

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # PostgreSQL metrics
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Qdrant metrics
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: '/metrics'

  # Node exporter (system metrics)
  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):10250'
        target_label: __address__
        replacement: '${1}:9100'

  # LLM API cost tracking
  - job_name: 'llm-costs'
    metrics_path: '/metrics/llm'
    static_configs:
      - targets: ['nexus-omni-backend:8000']
    scrape_interval: 60s

  # Blockchain metrics
  - job_name: 'blockchain'
    static_configs:
      - targets: ['ethereum-node:8545']
    metrics_path: '/debug/metrics/prometheus'
