# =============================================================================
# Prometheus Alert Rules for MUKTI
# =============================================================================

groups:
  - name: mukti.backend
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="nexus-omni-backend",status=~"5.."}[5m]))
          / sum(rate(http_requests_total{job="nexus-omni-backend"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }}"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="nexus-omni-backend"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P99 latency"
          description: "P99 latency is {{ $value }}s"

      - alert: PodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace=~"nexus-.*"}[1h]) > 5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Pod crash looping"
          description: "Pod {{ $labels.pod }} restarted {{ $value }} times"

  - name: mukti.economy
    rules:
      - alert: LLMSpike
        expr: increase(llm_cost_usd_total[1h]) > 100
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "LLM cost spike"
          description: "LLM cost increased by ${{ $value }} in last hour"

      - alert: TokenBudgetExceeded
        expr: llm_tokens_used_total / llm_tokens_budget_total > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Token budget nearly exhausted"

      - alert: NATSQueueBacklog
        expr: nats_jetstream_consumer_num_pending > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NATS queue backlog"

  - name: mukti.security
    rules:
      - alert: PromptInjectionDetected
        expr: increase(security_injection_detected_total[1h]) > 10
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Multiple prompt injection attempts"

      - alert: DataLeakageAttempt
        expr: increase(security_data_leakage_blocked_total[1h]) > 5
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Data leakage attempts detected"
