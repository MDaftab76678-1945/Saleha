name: Saleha AI CI/CD Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: PyTest & Type Check (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Configure Git Identity for CI
      run: |
        git config --global user.email "ci@saleha.ai"
        git config --global user.name "Saleha CI"
        git config --global init.defaultBranch main

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install click rich pydantic requests psutil PyYAML
        pip install -e . --no-deps
        pip install pytest pytest-asyncio

    - name: Verify Import Health
      run: |
        python -c "import saleha; print('saleha version:', saleha.__version__)"

    - name: Verify Strict Type Annotations
      run: |
        python scratch/check_type_hints.py

    - name: Run Full Test Suite (110+ Suites)
      env:
        OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
        PYTHONFAULTHANDLER: "1"
      run: |
        python scripts/ci_test_runner.py
