name: Saleha AI Multi-OS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: Pytest Matrix (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Core Dependencies & Test Suite
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]" pytest pytest-asyncio rich click psutil pydantic requests pyyaml

      - name: Execute Full Autonomous Test Suite
        run: |
          python -m pytest saleha/tests/ -q --durations=10

  release-check:
    name: Package Manifest & Pre-Flight Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]" pytest pytest-asyncio rich click psutil pydantic requests pyyaml
          python -m saleha.cli.commands release-check
          python -m build --wheel --sdist --outdir dist/
