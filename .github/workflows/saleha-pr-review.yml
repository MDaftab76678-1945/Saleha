name: ???? Saleha AI PR Reviewer Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  saleha-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Saleha Framework
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run Saleha Automated PR Review
        run: |
          saleha pr review main --output-file review.md

      - name: Post PR Review Comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('review.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

