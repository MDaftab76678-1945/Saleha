name: 🤖 Saleha AI PR Reviewer Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  saleha-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Saleha Framework
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run Saleha Automated PR Review
        run: |
          saleha ci review . --output pr_review.md --json || true

      - name: Post PR Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr_review.md')) {
              const report = fs.readFileSync('pr_review.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            }
