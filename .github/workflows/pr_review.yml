name: Saleha Autonomous PR Code Review & Security Audit

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Saleha AI PR Security & Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Saleha AI Action
        uses: ./
        with:
          scan-path: 'saleha/core'
          fail-on-critical: 'false'

      - name: Post Review Comment to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('saleha_review.md')) {
              const body = fs.readFileSync('saleha_review.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
