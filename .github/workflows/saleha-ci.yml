name: Saleha AI Autonomous CI/CD Review

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]

jobs:
  saleha-review:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    name: Saleha CI (${{ matrix.os }}, py${{ matrix.python-version }})
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Saleha AI Framework
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Test Suite
        run: |
          python -m unittest discover -s saleha/tests -v

      - name: Run Saleha Autonomous Review Bot
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          saleha ci review . --output pr_review.md --json

      - name: Post PR Review Comment
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr_review.md')) {
              const body = fs.readFileSync('pr_review.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

