\* tla/NexusAgenticV7.cfg
\* Model checking configuration for Nexus-Agentic v7 Baseline

CONSTANTS
    Agents = {"a1", "a2", "a3", "a4"}  \* 4 agents total
    MaxByzantine = 1                    \* f = 1 (satisfies f < |Agents|/3 => 1 < 4/3)
    ConstitutionHash = "SHA3_GENESIS_HASH"
    HaltTimeoutMs = 100

INIT Init
NEXT Next

\* ── SAFETY INVARIANTS (Checked on every reachable state) ──
INVARIANT TypeInvariant
INVARIANT ConstitutionalConsistency
INVARIANT SafetyInvariant
INVARIANT BFTInvariant
INVARIANT WeightIntegrity
INVARIANT CorrigibilityInvariant

\* ── LIVENESS PROPERTIES (Checked over all possible execution paths) ──
PROPERTY LivenessHalt
PROPERTY LivenessConsensus
