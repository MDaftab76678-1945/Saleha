# Rust workspace for saleha-0.1 — the native performance / sovereign layer.
# Assembled from Notebook/ + nexus-universe/ (see ../NOTEBOOK_IMPORT.md).
#
# NOTE: many crate dirs below carry only 1-2 source files pulled from chat
# exports and have no Cargo.toml yet. Add manifests + fill stubs before
# enabling them as workspace members.
[workspace]
resolver = "2"
members = [
    "intent-kernel",
    "saleha-l1",
    "saleha-executor",
    "saleha-l1-core",
    "crates/saleha-safety",
    "crates/agent-guardrails",
    "crates/agent-memory-dag",
    "crates/agent-snn-core",
    "crates/agent-causal-core",
    "crates/agent-crdt-core",
    "crates/agent-crypto",
    "crates/agent-tee-core",
    "crates/agent-runtime",
    "crates/saleha-consensus",
    "crates/agent-common",
    "crates/agent-saleha-l1",
    "crates/agent-cognition",
    "crates/saleha-federated",
    "crates/saleha-l1-oracle",
]
# Not members, and why (checked with cargo check, not assumed):
#   crates/saleha-benchmarks   benches call APIs that do not exist (PbftNode::simulate_round, ...)
#   crates/saleha-core         no [package]; needs rdma-core-sys / io-uring (Linux only)
#   crates/saleha-l1-economics, crates/saleha-l1-genesis, crates/saleha-l1-core-draft,
#   saleha-orchestrator-draft  reference types defined nowhere (AgentState, cognitive_state, ...)
#   crates/saleha-edge-lite    compiles once chrono is added, but its TEE attestation and
#                              payload hash are hardcoded strings printed as success
#   crates/saleha-l1-bridge, crates/saleha-l1-observability, saleha-zkvm
#                              need halo2_proofs / risc0 / tonic, not tried
#   crates/secure-node         needs tfhe, sqlx, reqwest, not tried
