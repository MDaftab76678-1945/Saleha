# Rust workspace for saleha-0.1 — the native performance / sovereign layer.
# Assembled from Notebook/ + nexus-universe/ (see ../NOTEBOOK_IMPORT.md).
#
# NOTE: many crate dirs below carry only 1-2 source files pulled from chat
# exports and have no Cargo.toml yet. Add manifests + fill stubs before
# enabling them as workspace members.
[workspace]
resolver = "2"
members = [
    "intent-kernel",
    "nexus-l1",
    "nexus-executor",
    "nexus-l1-core",
    "crates/nexus-safety",
    "crates/agent-guardrails",
    "crates/agent-memory-dag",
    "crates/agent-snn-core",
    "crates/agent-causal-core",
    "crates/agent-crdt-core",
    "crates/agent-crypto",
    "crates/agent-tee-core",
    "crates/agent-runtime",
    "crates/nexus-consensus",
]
# candidates to promote once they build:
#   "crates/nexus-consensus", "crates/nexus-core", "crates/nexus-safety",
#   "crates/agent-crypto", "crates/agent-tee-core", "crates/secure-node"
