[package]
name = "saleha-consensus"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
sha3 = "0.10"
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
blst = "0.3.13"
