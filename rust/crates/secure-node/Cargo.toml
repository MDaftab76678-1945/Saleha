[package]
name = "nexus-secure-node"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
# Zama's TFHE for Fully Homomorphic Encryption
tfhe = { version = "0.4.0", features = ["boolean", "shortint"] }
# Post-Quantum Signatures (mocked for now, use pqcrypto-dilithium in prod)
ring = "0.17.7"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }

# Error handling & logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Health check
reqwest = { version = "0.11", features = ["json"] }
