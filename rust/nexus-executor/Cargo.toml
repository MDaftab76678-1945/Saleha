[package]
name = "nexus-executor"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full", "parking_lot"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

