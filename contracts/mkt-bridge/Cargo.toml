[package]
name = "mkt-bridge"
version = "1.0.0"
edition = "2021"
description = "MUKTI Interchain Bridge - Neutron <-> Ethereum"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
backtraces = ["cosmwasm-std/backtraces"]

[dependencies]
cosmwasm-std = { version = "1.5", features = ["staking", "stargate"] }
cosmwasm-schema = "1.5"
cosmwasm-storage = "1.5"
cw-storage-plus = "1.2"
cw2 = "1.1"
cw20 = "1.1"
cw20-base = { version = "1.1", features = ["library"] }
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"
sha3 = "0.10"
hex = "0.4"

[dev-dependencies]
cw-multi-test = "0.20"
anyhow = "1.0"
