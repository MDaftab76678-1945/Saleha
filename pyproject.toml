[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saleha"
version = "2.6.0"
description = "Local-First Autonomous Multi-Agent AI Software Engineering Platform"
readme = "README.md"
authors = [{ name = "Aftab Alam", email = "alamaftab76678@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["ai", "agents", "multi-agent", "ollama", "mcp", "sast", "code-generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "PyYAML>=6.0.0"
]

[project.optional-dependencies]
browser = ["playwright>=1.35.0"]
voice = ["faster-whisper>=1.0", "pyttsx3>=2.90"]
codeintel = [
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21"
]
chain = [
    "web3>=6.0.0"
]
formal = [
    "z3-solver>=4.12"
]
# Cross-file repository graph (saleha.core.repo_graph / `saleha impact`).
# Code extraction is fully local -- no API key, nothing leaves the machine.
repograph = [
    "graphifyy>=0.9.55"
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    # Reference implementation for cyclomatic complexity. test_mech_interp.py
    # cross-checks our own counter against it; without radon that test skips.
    "radon>=6.0.0",
    # Cross-file repo graph. Without it, the 8 real-graph tests in
    # test_repo_graph.py skip (the discovery tests still run).
    "graphifyy>=0.9.55"
]
all = [
    "playwright>=1.35.0",
    "faster-whisper>=1.0",
    "pyttsx3>=2.90",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "web3>=6.0.0",
    "z3-solver>=4.12",
    "graphifyy>=0.9.55"
]

[project.scripts]
saleha = "saleha.cli.commands:cli"

[project.urls]
Homepage = "https://github.com/MDaftab76678-1945/Saleha"
Documentation = "https://github.com/MDaftab76678-1945/Saleha/tree/main/docs"
Repository = "https://github.com/MDaftab76678-1945/Saleha.git"
Issues = "https://github.com/MDaftab76678-1945/Saleha/issues"

# The repo root holds many non-Python directories (apps/, rust/, deploy/,
# contracts/, ...), so setuptools' automatic discovery refuses to guess and
# the build fails. The deleted setup.py used find_packages(); this says the
# same thing declaratively.
[tool.setuptools.packages.find]
include = ["saleha*"]
exclude = ["saleha.tests*"]

[tool.pytest.ini_options]
testpaths = ["saleha/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [
    "templates",
    "node_modules",
    ".git",
    ".pytest_cache",
    "workspace",
    "test_dynamic_ws",
    "scratch",
    "apps",
    "dist",
    "build"
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    ".venv_train",
    "node_modules",
    "apps",
    "dist",
    "build",
    "workspace"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.pyright]
include = ["saleha"]
exclude = ["**/node_modules", "**/__pycache__", "apps", "dist", "build", ".venv*"]
pythonVersion = "3.12"
typeCheckingMode = "basic"


