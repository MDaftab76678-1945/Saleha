[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saleha"
version = "1.4.0"
description = "Local-First Autonomous Multi-Agent AI Software Engineering Platform"
readme = "README.md"
authors = [{ name = "Aftab Alam", email = "alamaftab76678@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["ai", "agents", "multi-agent", "ollama", "mcp", "sast", "code-generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "PyYAML>=6.0.0"
]

[project.optional-dependencies]
browser = ["playwright>=1.35.0"]
voice = ["faster-whisper>=1.0", "pyttsx3>=2.90"]
codeintel = [
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21"
]
all = ["playwright>=1.35.0", "tree-sitter>=0.22", "tree-sitter-python>=0.21", "tree-sitter-javascript>=0.21", "tree-sitter-typescript>=0.21"]

[project.scripts]
saleha = "saleha.cli.commands:cli"

[project.urls]
Homepage = "https://github.com/aftab-alam/saleha-0.1"
Documentation = "https://github.com/aftab-alam/saleha-0.1/tree/main/docs"
Repository = "https://github.com/aftab-alam/saleha-0.1.git"
Issues = "https://github.com/aftab-alam/saleha-0.1/issues"

